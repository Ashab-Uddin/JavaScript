<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <h1>Learn Event Handle</h1>
    <button onclick="makeYello()">Click Me</button>
    <script>
        function makeYello(){
            document.body.style.backgroundColor = 'Yellow';
        }
    </script>
</body>
</html>
