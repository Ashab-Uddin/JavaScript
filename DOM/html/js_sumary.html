<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM <Summary></Summary></title>
</head>
<body>
    <h1>Final Dom Even Handler</h1>
    <h3 id="handle-statue">Default Text</h3>
    <button onclick="handleOnclick()">Handle Event by add onclick function</button>
    <script>
        function handleOnclick(){
            const handlerstatus = document.getElementById('handle-statue');
            handlerstatus.innerText = 'text updated';
        }
    </script>
</body>
</html>
