<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get setFullYear</title>
</head>
<body>
    <p id="demo"></p>
<script>
    const d=new Date("March 02,2020");
    document.getElementById('demo').innerHTML = d.getFullYear();
</script>
</body>
</html>
